# .github/workflows/ci.yml
# ============================================================
# ResumeIQ — Continuous Integration Pipeline
# Runs on every push and pull request to main.
# Steps: checkout → Python setup → install deps → pytest
# ============================================================

name: CI — ResumeIQ Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout repository ──────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Set up Python 3.10 ───────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ── Step 3: Install system dependencies (Tesseract) ──
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr

      # ── Step 4: Install Python dependencies ──────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 5: Run pytest ────────────────────────────────
      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short --cov=services --cov-report=term-missing

      # ── Step 6: (Optional) Deploy to Render on push to main
      # Uncomment and set RENDER_DEPLOY_HOOK secret to enable auto-deploy
      # - name: Trigger Render Deploy
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   run: |
      #     curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
